proxy_cache_path /var/cache/baltigogames levels=1:2 keys_zone=baltigogames:10m max_size=512m inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name games.187-77-255-164.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.187-77-255-164.sslip.io;
    ssl_certificate /etc/letsencrypt/live/games.187-77-255-164.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.187-77-255-164.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/baltigogames.access.log;
    error_log /var/log/nginx/baltigogames.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ~ /\. { deny all; }
    location = /health {
        proxy_pass http://127.0.0.1:8056;
        add_header Cache-Control no-store always;
    }
    location /play/ {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache baltigogames;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 40s;
        add_header X-Game-Cache $upstream_cache_status always;
    }
    location / {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 40s;
    }
}
