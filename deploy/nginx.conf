proxy_cache_path /var/cache/baltigogames-v2 levels=1:2 keys_zone=baltigogames_v2:10m max_size=512m inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name games.187-77-255-164.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.187-77-255-164.sslip.io;
    ssl_certificate /etc/letsencrypt/live/games.187-77-255-164.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.187-77-255-164.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    gzip_vary on;
    client_max_body_size 1m;
    access_log /var/log/nginx/baltigogames.access.log;
    error_log /var/log/nginx/baltigogames.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ~ /\. { deny all; }
    location ~ "^/play(?:-v[23])?/(?<baltigo_game_relative>games/[-A-Za-z0-9_./%+ @,()~]+[.](?i:png|jpe?g|gif|webp|svg|avif|ico|bmp|ttf|otf|woff2?|mp3|ogg|wav|m4a|mp4|webm|bin|wasm|glb|fbx))$" {
        root $baltigo_asset_root;
        disable_symlinks on from=$baltigo_asset_root;
        try_files /$baltigo_asset_relative @baltigo_asset_proxy;
        include /etc/nginx/mime.types;
        types {
            font/ttf ttf;
            font/woff woff;
            font/woff2 woff2;
        }
        sendfile on;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Game-Delivery nginx-file always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location @baltigo_asset_proxy {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache baltigogames_v2;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 40s;
        add_header X-Game-Cache $upstream_cache_status always;
    }

    location ^~ /_baltigo_game_assets/ {
        internal;
        alias /opt/baltigogames/upstream/c97ef8b/;
        sendfile on;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location ^~ /_baltigo_game_art/ {
        internal;
        alias /opt/baltigogames/current/web/;
        sendfile on;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location = / {
        root /opt/baltigogames/current/web;
        try_files /index.html =404;
        add_header Cache-Control no-cache always;
    }
    location /static/ {
        alias /opt/baltigogames/current/web/;
        include /etc/nginx/mime.types;
        types {
            font/ttf ttf;
            font/woff woff;
            font/woff2 woff2;
        }
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/catalog {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache baltigogames_v2;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_hide_header Set-Cookie;
        add_header X-Catalog-Cache $upstream_cache_status always;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8056;
        add_header Cache-Control no-store always;
    }
    location ~ ^/play(?:-v[23])?/ {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache baltigogames_v2;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 40s;
        add_header X-Game-Cache $upstream_cache_status always;
    }
    location / {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 40s;
    }
