name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Catalog integrity
        run: python scripts/validate_catalog.py
      - name: Unit and integration tests
        env:
          BOT_TOKEN: ""
        run: pytest -q tests/test_app.py tests/test_static.py

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Start Baltigo Games
        env:
          BOT_TOKEN: ""
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/baltigo.log 2>&1 &
          echo $! > /tmp/baltigo.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/baltigo.log
          exit 1
      - name: Browser smoke tests
        run: python tests/e2e_smoke.py
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baltigo-games-visual-snapshots
          path: artifacts/
          if-no-files-found: warn

  docker:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t baltigo-games:test .
      - name: Boot image and healthcheck
        run: |
          docker run -d --name baltigo-games-test -p 8001:8000 -e BOT_TOKEN= baltigo-games:test
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health -o /tmp/health.json; then
              python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["ok"] is True; assert d["games"] == 142; assert d["bot_configured"] is False; print("Docker health OK")'
              exit 0
            fi
            sleep 1
          done
          docker logs baltigo-games-test
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f baltigo-games-test || true
